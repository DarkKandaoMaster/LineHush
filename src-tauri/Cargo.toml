[package]
name = "linehush"
version = "0.9.0"
description = "LineHush：Windows 本地优先图文笔记编辑器"
authors = ["Kandao"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "linehush_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "~2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
# blob：播放视频 / 音频时按范围读原始字节（db.rs `image_range`），不整块读进内存。
rusqlite = { version = "0.40", features = ["bundled", "blob"] }
sha2 = "0.11"
tauri-plugin-single-instance = "2"
# 自动检查更新（update.rs；仓库根目录的 latest.json，见 docs/design/auto-update-2026-10-29.md）。
# TLS 用 rustls + ring，证书按 Windows 系统证书库校验（rustls-platform-verifier），走系统代理。
# 这几个原先 tauri-plugin-updater 就在用，Cargo.lock 里都有；reqwest 0.13 的默认 TLS 要 aws-lc-rs，不用。
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "1"
clipboard-win = "5.4"
# 导出 PDF 调用 WebView2 的 PrintToPdf。版本须与 wry 所用的一致（webview2-com 0.38 / windows 0.61），
# 否则 Tauri 给出的 WebView2 接口类型对不上。
webview2-com = "0.38"
# 自绘标题栏的最大化按钮覆盖窗口（caption.rs）与“打开文件所在位置”（explorer.rs，Shell）另需这些 Win32 模块。
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

# Debug builds would otherwise take seconds to decode a large photo.
[profile.dev.package."*"]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
